<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Essential Meta Tags -->
    <title>{% block title %}Book Worm | Discover Your Next Great Read{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Welcome to Book Worm, your premier online bookstore. Explore our vast collection of new releases, top bestsellers, academic materials, and classic literature.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}books, bookstore, online bookstore, buy books, reading, novels, literature, academic books, bestsellers{% endblock %}">
    <meta name="author" content="Book Worm">
    <meta name="robots" content="index, follow">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Canonical URL -->
    {% block canonical %}
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    {% endblock %}

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:site_name" content="Book Worm">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:title" content="{% block og_title %}Book Worm | Discover Your Next Great Read{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Welcome to Book Worm, your premier online bookstore. Explore our vast collection of new releases and classic literature.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://ui-avatars.com/api/?name=Book+Worm&background=f97316&color=fff&size=512{% endblock %}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@BookWormStore">
    <meta name="twitter:title" content="{% block twitter_title %}Book Worm | Discover Your Next Great Read{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Welcome to Book Worm, your premier online bookstore. Explore our vast collection of new releases and classic literature.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}https://ui-avatars.com/api/?name=Book+Worm&background=f97316&color=fff&size=512{% endblock %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
        
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Skeleton shimmer animation */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Image skeleton lazy wrapper */
        .img-skeleton-container {
            position: relative;
            background: #e2e8f0;
            overflow: hidden;
        }

        .img-skeleton-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #f1f5f9 25%, #cbd5e1 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            z-index: 1;
            transition: opacity 0.3s ease-out;
        }

        .img-skeleton-container.loaded::before {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
</head>
<body>
    
    {% include 'includes/loader.html' %}
    {% include 'includes/header.html' %}

    <main>
        {% block content %}

        {% endblock %}
    </main>


    {% include 'includes/footer.html' %}

    <script>
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            background: '#ffffff',
            color: '#334155',
            customClass: {
                popup: 'rounded-2xl border-l-4 shadow-xl',
            }
        });

        // 1. Django Messages Framework ke liye (Login/Logout/Signup Success)
        {% if messages %}
        {% for message in messages %}
        let iconTag = '{{ message.tags }}';
        let bColor = iconTag === 'success' ? '#14b8a6' : '#f97316';

        Toast.fire({
            icon: iconTag === 'error' || iconTag === 'danger' ? 'error' : iconTag,
            title: '{{ message|escapejs }}',
            didOpen: (toast) => { toast.style.borderLeftColor = bColor; }
        });
        {% endfor %}
        {% endif %}

        // 2. Login/Invalid Credentials Error ke liye
        // Agar page par form error hai (jaise login page par)
        {% if form.errors %}
        {% for field, errors in form.errors.items %}
        {% for error in errors %}
        Toast.fire({
            icon: 'error',
            title: '{{ error|escapejs }}',
            didOpen: (toast) => { toast.style.borderLeftColor = '#ef4444'; }
        });
        {% endfor %}
        {% endfor %}

        // Non-field errors (Jaise: "Username and password did not match")
        {% for error in form.non_field_errors %}
        Toast.fire({
            icon: 'error',
            title: '{{ error|escapejs }}',
            didOpen: (toast) => { toast.style.borderLeftColor = '#ef4444'; }
        });
        {% endfor %}
        {% endif %}
        // Image Skeleton load handlers
        document.addEventListener('DOMContentLoaded', function() {
            function checkImages() {
                const skeletonImgs = document.querySelectorAll('.img-skeleton-container img');
                skeletonImgs.forEach(img => {
                    if (img.complete && img.naturalHeight !== 0) {
                        img.closest('.img-skeleton-container')?.classList.add('loaded');
                    } else {
                        img.addEventListener('load', function() {
                            this.closest('.img-skeleton-container')?.classList.add('loaded');
                        });
                        img.addEventListener('error', function() {
                            this.closest('.img-skeleton-container')?.classList.add('loaded');
                        });
                    }
                });
            }
            checkImages();
            setTimeout(checkImages, 500);
        });
    </script>
    
</body>
</html>

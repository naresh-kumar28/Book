{% extends 'base.html' %}

{% block title %}Book Warm | Profile Dashboard{% endblock %}

{% block content %}

{% include 'includes/sticky-button.html' %}

<div class="min-h-screen bg-gray-50 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row gap-8">

            {% include 'user/sidebar.html' %}

            <main class="flex-1 space-y-6">

                <div class="flex justify-between items-start mb-8">
                    <h2
                        class="text-lg md:text-2xl font-bold text-gray-900 border-l-[3px] md:border-l-4 border-orange-500 pl-2 md:pl-3">
                        Wishlist
                    </h2>

                    <span class="text-gray-500 text-sm font-medium mt-1.5">12 Items Saved</span>
                </div>

                <!-- 1 Product  -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

                    <div
                        class="w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-4 hover:shadow-xl transition-all duration-300 relative group/card">

                        <span
                            class="absolute top-6 left-6 bg-orange-500 text-white text-[10px] font-bold px-2 py-1 rounded-md z-20 shadow-sm">
                            15% OFF
                        </span>

                        <button
                            class="absolute top-4 right-4 bg-white p-1.5 rounded-full shadow-md text-red-500 hover:bg-red-50 transition-colors z-20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current" viewBox="0 0 24 24">
                                <path
                                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                            </svg>
                        </button>

                        <div
                            class="relative h-52 flex items-center justify-center mb-4 bg-gray-50 rounded-xl overflow-hidden">
                            <div class="relative flex items-center justify-center w-full">
                                <img src="https://nageenprakashan.in/cdn/shop/files/Nootan_UP_Board_Hindi_Text_Book_For_Class_12th_-_Academic_Year_2025-26_By_Survesh_Kant_Verma_-_Nageen_Prakashan_8.webp?v=1744361938"
                                    class="w-32 h-40 object-cover rounded shadow-2xl z-10 border-2 border-white">
                            </div>
                        </div>

                        <div class="space-y-1 mb-4">
                            <h3 class="font-bold text-gray-800 truncate" title="Hindi II For Class - 12">Hindi II For
                                Class - 12...</h3>
                            <p
                                class="text-[10px] text-indigo-600 font-bold uppercase tracking-wider bg-indigo-50 w-max px-2 py-0.5 rounded">
                                NCERT
                            </p>
                            <div class="flex items-center space-x-2 pt-1">
                                <span class="text-lg font-bold text-green-600">₹450</span>
                                <span class="text-sm text-gray-400 line-through">₹650</span>
                                <span
                                    class="bg-green-600 text-white text-[9px] px-1.5 py-0.5 rounded font-bold ml-auto uppercase">Save
                                    ₹200</span>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button
                                class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2.5 rounded-xl text-[12px] font-bold transition-all transform active:scale-95 shadow-sm">
                                Buy Now
                            </button>
                            <button
                                class="w-full bg-teal-600 hover:bg-teal-700 text-white py-2.5 rounded-xl text-[12px] font-semibold flex items-center justify-center transition-colors">
                                Add to Cart
                            </button>
                        </div>
                    </div>

                </div>

            </main>

        </div>
    </div>
</div>

{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Worm{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <header class="bg-white border-2-b border-2-gray-200 sticky top-0 z-50 shadow-sm">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
    
                <div class="flex-shrink-0 flex items-center min-w-[40px]">
                    <a href="{% url 'home' %}" class="hidden md:block text-2xl font-bold text-indigo-600 tracking-tight">
                        Book<span class="text-orange-500">Worm</span>
                    </a>
    
                    <!-- Mobile Profile icon -->
                    <div class="block md:hidden pr-5">
                        <div class="w-10 h-10 rounded-full overflow-hidden border-2-2 border-2-orange-400">
                            <a href="{% url 'home' %}">
                                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User DP"
                                    class="w-full h-full object-cover">
                            </a>
                        </div>
                    </div>
                </div>
    
                <!-- stepper  -->
                <div class="flex-1 max-w-[280px] md:max-w-md mx-auto pt-2 pb-5 md:pb-8">
                    <div class="relative flex items-center justify-between w-full">
    
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[1.5px] bg-gray-100 z-0"></div>
    
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 h-[1.5px] bg-orange-500 z-0 transition-all duration-500"
                            style="width: 0%;"></div>
    
                        <div class="relative z-10 flex flex-col items-center">
                            <div
                                class="w-7 h-7 bg-white border-2 border-orange-500 rounded-full flex items-center justify-center shadow-sm transition-all">
                                <span class="text-orange-600 font-medium text-[10px] md:text-xs">1</span>
                            </div>
                            <span
                                class="absolute top-8 text-[10px] md:text-xs font-medium text-orange-600 whitespace-nowrap">Cart</span>
                        </div>
    
                        <div class="relative z-10 flex flex-col items-center">
                            <div
                                class="w-7 h-7 bg-white border-2 border-gray-200 rounded-full flex items-center justify-center text-gray-400 transition-all">
                                <span class="font-medium text-[10px] md:text-xs">2</span>
                            </div>
                            <span
                                class="absolute top-8 text-[10px] md:text-xs font-medium text-gray-400 whitespace-nowrap">Address</span>
                        </div>
    
                        <div class="relative z-10 flex flex-col items-center">
                            <div
                                class="w-7 h-7 bg-white border-2 border-gray-200 rounded-full flex items-center justify-center text-gray-400 transition-all">
                                <span class="font-medium text-[10px] md:text-xs">3</span>
                            </div>
                            <span
                                class="absolute top-8 text-[10px] md:text-xs font-medium text-gray-400 whitespace-nowrap">Payment</span>
                        </div>
    
                        <div class="relative z-10 flex flex-col items-center">
                            <div
                                class="w-7 h-7 bg-white border-2 border-gray-200 rounded-full flex items-center justify-center text-gray-400 transition-all">
                                <span class="font-medium text-[10px] md:text-xs">4</span>
                            </div>
                            <span
                                class="absolute top-8 text-[10px] md:text-xs font-medium text-gray-400 whitespace-nowrap">Summary</span>
                        </div>
    
                    </div>
                </div>
    
                <!-- cart, wishlist, login  -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="#" class="text-gray-600 hover:text-red-500 transition-colors relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                        <span
                            class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">2</span>
                    </a>
    
                    <a href="#" class="text-gray-600 hover:text-orange-500 transition-colors relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span
                            class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">3</span>
                    </a>
    
                    <button
                        class="bg-gray-900 text-white px-5 py-2.5 rounded-lg hover:bg-orange-600 transition-all font-medium">
                        Login
                    </button>
                </div>
    
                <div class="block md:hidden min-w-[40px]"></div>
    
            </div>
        </nav>
    </header>

    {% block content %}

    {% endblock %}

</body>
</html>

{% extends 'admin/admin_base.html' %}

{% block content %}

<div class="flex-1 overflow-y-auto p-6 lg:p-8">

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
        <h1 class="text-2xl font-bold text-white tracking-wide">Dashboard</h1>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

        <div class="bg-[#1e293b] border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
                <div
                    class="w-12 h-12 bg-purple-500/10 rounded-lg flex items-center justify-center border border-purple-500/20">
                    <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm font-medium text-slate-400">New Orders</p>
                <h3 class="text-2xl font-bold text-white mt-1">34567</h3>
            </div>
            
        </div>

        <div class="bg-[#1e293b] border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
                <div
                    class="w-12 h-12 bg-emerald-500/10 rounded-lg flex items-center justify-center border border-emerald-500/20">
                    <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm font-medium text-slate-400">Total Income</p>
                <h3 class="text-2xl font-bold text-white mt-1">₹ 74,567</h3>
            </div>
            
        </div>

        <div class="bg-[#1e293b] border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
                <div
                    class="w-12 h-12 bg-blue-500/10 rounded-lg flex items-center justify-center border border-blue-500/20">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm font-medium text-slate-400">Total Expense</p>
                <h3 class="text-2xl font-bold text-white mt-1">₹ 24,567</h3>
            </div>
            
        </div>

        <div class="bg-[#1e293b] border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
                <div class="w-12 h-12 bg-blue-500/10 rounded-lg flex items-center justify-center border border-blue-500/20">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm font-medium text-slate-400">Total Users</p>
                <h3 class="text-2xl font-bold text-white mt-1">{{ total_users }}</h3>
            </div>
        </div>
        
        <div class="bg-[#1e293b] border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
                <div
                    class="w-12 h-12 bg-emerald-500/10 rounded-lg flex items-center justify-center border border-emerald-500/20">
                    <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm font-medium text-slate-400">Total Books</p>
                <h3 class="text-2xl font-bold text-white mt-1">{{ total_books }}</h3>
            </div>
        </div>
        
        <div class="bg-[#1e293b] border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
                <div class="w-12 h-12 bg-purple-500/10 rounded-lg flex items-center justify-center border border-purple-500/20">
                    <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm font-medium text-slate-400">Total Authors</p>
                <h3 class="text-2xl font-bold text-white mt-1">{{ total_authors }}</h3>
            </div>
        </div>
        
        <div class="bg-[#1e293b] border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
                <div class="w-12 h-12 bg-orange-500/10 rounded-lg flex items-center justify-center border border-orange-500/20">
                    <svg class="w-6 h-6 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm font-medium text-slate-400">Total Categories</p>
                <h3 class="text-2xl font-bold text-white mt-1">{{ total_categories }}</h3>
            </div>
        </div>

    </div>

    

</div>

{% endblock %}

<!-- Centered Page Loader Overlay -->
<div id="page-loader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white/90 dark:bg-gray-950/90 backdrop-blur-md transition-all duration-300 pointer-events-auto">
    <div class="relative flex flex-col items-center justify-center p-8 rounded-3xl">
        <!-- Dual Glowing Outer & Inner Spinner -->
        <div class="relative flex items-center justify-center w-24 h-24 mb-6">
            <!-- Outer Ring Spinner -->
            <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-orange-500 border-r-orange-400 animate-spin"></div>
            <!-- Inner Reverse Ring Spinner -->
            <div class="absolute inset-2 rounded-full border-4 border-transparent border-b-indigo-600 border-l-indigo-500 animate-[spin_1.5s_linear_infinite_reverse]"></div>
            
            <!-- Center Brand Logo Icon Badge -->
            <div class="relative z-10 w-12 h-12 bg-gradient-to-tr from-orange-500 to-amber-400 rounded-2xl shadow-lg shadow-orange-500/30 flex items-center justify-center transform animate-pulse">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" 
                          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
            </div>
        </div>

        <!-- Brand Text & Subtitle -->
        <div class="text-center">
            <h3 class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white mb-1">
                Book<span class="text-orange-500">Worm</span>
            </h3>
            <p id="loader-message" class="text-sm font-medium text-gray-500 dark:text-gray-400 flex items-center justify-center gap-1">
                <span id="loader-text-val">Loading</span>
                <span class="inline-flex gap-1 items-center ml-1">
                    <span class="w-1.5 h-1.5 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0s;"></span>
                    <span class="w-1.5 h-1.5 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0.15s;"></span>
                    <span class="w-1.5 h-1.5 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0.3s;"></span>
                </span>
            </p>
        </div>
    </div>
</div>

<script>
    (function () {
        const loader = document.getElementById('page-loader');
        const loaderTextVal = document.getElementById('loader-text-val');

        window.showCenterLoader = function (msg = 'Loading') {
            if (!loader) return;
            if (loaderTextVal && msg) {
                loaderTextVal.textContent = msg;
            }
            loader.classList.remove('opacity-0', 'pointer-events-none');
            loader.classList.add('opacity-100', 'pointer-events-auto');
        };

        window.hideCenterLoader = function () {
            if (!loader) return;
            loader.classList.remove('opacity-100', 'pointer-events-auto');
            loader.classList.add('opacity-0', 'pointer-events-none');
        };

        // Hide loader when page is fully ready
        function dismissLoader() {
            setTimeout(function () {
                window.hideCenterLoader();
            }, 150);
        }

        if (document.readyState === 'complete') {
            dismissLoader();
        } else {
            window.addEventListener('load', dismissLoader);
            document.addEventListener('DOMContentLoaded', function () {
                setTimeout(dismissLoader, 350);
            });
        }

        // Show loader on navigating link clicks
        document.addEventListener('click', function (e) {
            const anchor = e.target.closest('a');
            if (!anchor) return;
            const href = anchor.getAttribute('href');

            if (
                href &&
                !href.startsWith('#') &&
                !href.startsWith('javascript:') &&
                !href.startsWith('mailto:') &&
                !href.startsWith('tel:') &&
                anchor.target !== '_blank' &&
                !e.ctrlKey && !e.metaKey && !e.shiftKey
            ) {
                window.showCenterLoader('Loading page...');
            }
        });

        // Show loader on form submission
        document.addEventListener('submit', function (e) {
            const form = e.target;
            if (form && !form.getAttribute('data-no-loader')) {
                window.showCenterLoader('Processing...');
            }
        });
    })();
</script>

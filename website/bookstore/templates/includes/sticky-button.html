    class="fixed bottom-0 left-0 z-40 w-full h-16 bg-white border-t border-gray-200 md:hidden transition-all duration-500 shadow-[0_-5px_15px_rgba(0,0,0,0.08)] rounded-t-3xl">
    <div class="grid h-full grid-cols-4 mx-auto font-medium">

        <a href="{% url 'home' %}" class="inline-flex flex-col items-center justify-center group">
            <svg class="w-6 h-6 text-gray-500 group-hover:text-orange-600" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span class="text-[10px] uppercase font-bold text-gray-500 group-hover:text-orange-600">Home</span>
        </a>

        <a href="{% url 'cart' %}" class="inline-flex flex-col items-center justify-center group relative">
            <div class="relative">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-orange-600" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span
                    class="absolute -top-1.5 -right-2 bg-orange-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white">3</span>
            </div>
            <span class="text-[10px] uppercase font-bold text-gray-500 group-hover:text-orange-600">Checkout</span>
        </a>

        <a href="#" class="inline-flex flex-col items-center justify-center group relative">
            <div class="relative">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-orange-600" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
                <span
                    class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white">2</span>
            </div>
            <span class="text-[10px] uppercase font-bold text-gray-500 group-hover:text-orange-600">Wishlist</span>
        </a>

        <a href="#" class="inline-flex flex-col items-center justify-center group">
            <svg class="w-6 h-6 text-gray-500 group-hover:text-orange-600" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <span class="text-[10px] uppercase font-bold text-gray-500 group-hover:text-orange-600">My Order</span>
        </a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const bottomNav = document.getElementById('bottom-mobile-nav');
        const footer = document.getElementById('main-footer');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Footer aate hi hide karo
                    bottomNav.style.transform = 'translateY(100%)';
                    bottomNav.style.opacity = '0';
                } else {
                    // Footer jate hi wapas dikhao
                    bottomNav.style.transform = 'translateY(0)';
                    bottomNav.style.opacity = '1';
                }
            });
        }, { threshold: 0.1 });

        if (footer) {
            observer.observe(footer);
        }
    });
</script>

<!-- Reusable Skeleton Book Card -->
<div class="skeleton-book-card bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col justify-between h-full animate-pulse">
    <!-- Image Box Skeleton -->
    <div class="relative w-full aspect-[3/4] bg-gray-200 rounded-xl overflow-hidden mb-4 skeleton-shimmer">
        <div class="absolute top-2 left-2 w-12 h-5 bg-gray-300 rounded-md"></div>
    </div>
    
    <!-- Text Lines Skeleton -->
    <div class="space-y-3 flex-1 flex flex-col justify-between">
        <div>
            <!-- Category Tag -->
            <div class="w-20 h-3 bg-gray-200 rounded-full mb-2"></div>
            <!-- Title line 1 -->
            <div class="w-full h-4 bg-gray-300 rounded mb-1"></div>
            <!-- Title line 2 -->
            <div class="w-3/4 h-4 bg-gray-200 rounded"></div>
        </div>
        
        <!-- Author / Format -->
        <div class="w-1/2 h-3 bg-gray-200 rounded"></div>

        <!-- Rating Stars Skeleton -->
        <div class="flex items-center space-x-1 pt-1">
            <div class="w-3.5 h-3.5 bg-gray-200 rounded-full"></div>
            <div class="w-3.5 h-3.5 bg-gray-200 rounded-full"></div>
            <div class="w-3.5 h-3.5 bg-gray-200 rounded-full"></div>
            <div class="w-3.5 h-3.5 bg-gray-200 rounded-full"></div>
            <div class="w-3.5 h-3.5 bg-gray-200 rounded-full"></div>
            <div class="w-8 h-3 bg-gray-200 rounded ml-2"></div>
        </div>
        
        <!-- Price and Action Button -->
        <div class="pt-3 border-t border-gray-100 flex items-center justify-between">
            <div class="space-y-1">
                <div class="w-16 h-5 bg-gray-300 rounded"></div>
                <div class="w-10 h-3 bg-gray-200 rounded line-through"></div>
            </div>
            <div class="w-24 h-9 bg-orange-200 rounded-xl"></div>
        </div>
    </div>
</div>
